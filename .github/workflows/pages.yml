name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare static site
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::Imposta la variabile di repository API_BASE_URL (URL del backend su Vercel)."
            exit 1
          fi
          mkdir _site
          cp index.html style.css app.js service-worker.js manifest.webmanifest icon.svg icon-192.png icon-512.png _site/
          node -e "require('fs').writeFileSync('_site/config.js', 'window.APP_CONFIG = ' + JSON.stringify({ apiBase: process.env.API_BASE_URL }) + ';\n')"
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
